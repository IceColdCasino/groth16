name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.17.0
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) zarch=aarch64 ;;
            x86_64) zarch=x86_64 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          url="https://ziglang.org/download/0.17.0/zig-${zarch}-macos-0.17.0.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "$url"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/zig/zig" version)" = "0.17.0"

      - name: Test
        run: |
          set -euo pipefail
          zig version
          zig build test -Doptimize=ReleaseFast

      - name: Build release artifacts
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/prefix"
          zig build -Doptimize=ReleaseFast --prefix "$prefix"
          test -x "$prefix/bin/zkey"
          test -x "$prefix/bin/prover"
          test -f "$prefix/bin/bn254.metallib"
          test -f "$prefix/lib/libgroth16.dylib"
          test -f "$prefix/include/groth16.h"
          nm -gU "$prefix/lib/libgroth16.dylib" | grep -q ' _groth16_verify$'
          libpath="$("$prefix/bin/zkey" lib)"
          expected="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$prefix/lib/libgroth16.dylib")"
          test "$libpath" = "$expected"
          set +o pipefail
          "$prefix/bin/zkey" 2>&1 | grep -q 'zkey lib'

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$(uname -m)" in
            arm64) zarch=aarch64 ;;
            x86_64) zarch=x86_64 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          name="groth16-${version}-macos-${zarch}"
          prefix="${RUNNER_TEMP}/prefix"
          stage="${RUNNER_TEMP}/${name}"
          mkdir -p "$stage/bin" "$stage/lib" "$stage/include"
          cp "$prefix/bin/zkey" "$prefix/bin/prover" "$prefix/bin/bn254.metallib" "$stage/bin/"
          cp "$prefix/lib/libgroth16.dylib" "$prefix/lib/libgroth16.a" "$stage/lib/"
          cp "$prefix/include/groth16.h" "$stage/include/"
          install_name_tool -id @rpath/libgroth16.dylib "$stage/lib/libgroth16.dylib"
          codesign --sign - --force "$stage/bin/zkey" "$stage/bin/prover" "$stage/lib/libgroth16.dylib"
          libpath="$("$stage/bin/zkey" lib)"
          expected="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$stage/lib/libgroth16.dylib")"
          test "$libpath" = "$expected"
          tar -C "$RUNNER_TEMP" -czf "${RUNNER_TEMP}/${name}.tar.gz" "$name"
          shasum -a 256 "${RUNNER_TEMP}/${name}.tar.gz"
          cat > "${RUNNER_TEMP}/notes.md" <<EOF
          ## ${version}

          Groth16 prover and \`zkey\` setup tool for macOS.

          \`libgroth16\` is a drop-in for librapidsnark: the same \`groth16_*\` C entry points, JSON proof and public inputs, and return codes. \`zkey\` is a drop-in for snarkjs zkey setup, contribute, and verification-key export. The default prove path runs Zig on the CPU and Metal on the GPU together. Circuits whose domain is 4096 or smaller stay on the Zig CPU prover.

          The BN254 roots of unity from order 2^16 through 2^18 match the squaring chain. \`PROVER_CHECK=1\` compares the Metal H polynomial and multiscalar multiplies with the CPU.

          ### Archive

          \`${name}.tar.gz\` is an Apple Silicon build for macOS 14 and newer. Layout:

          - \`bin/zkey\`
          - \`bin/prover\`
          - \`bin/bn254.metallib\`
          - \`lib/libgroth16.dylib\`
          - \`lib/libgroth16.a\`
          - \`include/groth16.h\`

          This archive is the Metal build. \`zkey lib\` prints the shared library path and the link flags. The library sits at \`bin/../lib/libgroth16.dylib\` relative to the \`zkey\` binary.

          \`\`\`sh
          brew trust --tap IceColdCasino/groth16
          brew tap IceColdCasino/groth16 https://github.com/IceColdCasino/groth16
          brew install icecoldcasino/groth16/zkey
          \`\`\`

          \`brew install --HEAD --with-vulkan\` builds the Vulkan backend from main. That path needs Zig 0.17, Xcode, glslang, and MoltenVK.

          ### Speed

          Measured on an Apple M1 Max (10 CPU cores, 32 GPU cores, 64 GB), quiet machine, second run.

          Blackjack showdown key setup and contribute: 31.32 s, compared with snarkjs at 340.69 s (10.9×). snarkjs on that key was 250.53 s of setup and 90.16 s of contribute.

          Prove, witness from libzkcasino, \`r = s = 0\`, verified with snarkjs:

          | Circuit | CPU + Metal | rapidsnark | speedup |
          |---|---:|---:|---:|
          | Blackjack showdown (661,104 signals) | 1.75 s | 3.28 s | 1.9× |
          | Poker showdown (2,244,633 signals) | 6.58 s | 10.02 s | 1.5× |

          Proofs with \`r = s = 0\` verify. rapidsnark draws its own \`r\` and \`s\`, so those proof bytes differ. Sections 1–9 of the blackjack proving key match snarkjs. The exported verification key matches snarkjs. Smaller keys, including a coefficient-5 circuit proved with the Metal and CPU split, match snarkjs byte for byte.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$version" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            "${RUNNER_TEMP}/${name}.tar.gz"
