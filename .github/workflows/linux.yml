name: Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y glslang-tools libvulkan-dev

      - name: Install Zig 0.17.0
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) zarch=x86_64 ;;
            aarch64) zarch=aarch64 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          url="https://ziglang.org/download/0.17.0/zig-${zarch}-linux-0.17.0.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "$url"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/zig/zig" version)" = "0.17.0"

      - name: Build release artifacts
        run: |
          set -euo pipefail
          zig version
          prefix="${RUNNER_TEMP}/prefix"
          # baseline, not the runner's native CPU. A native build SIGILLs on other GitHub hosts.
          zig build -Doptimize=ReleaseFast -Dvulkan=true -Dcpu=baseline --prefix "$prefix"
          test -x "$prefix/bin/zkey"
          test -x "$prefix/bin/prover"
          test ! -e "$prefix/bin/bn254.metallib"
          test -f "$prefix/lib/libgroth16.so"
          test -f "$prefix/include/groth16.h"
          nm -D "$prefix/lib/libgroth16.so" | grep -q ' groth16_verify$'
          if ldd "$prefix/lib/libgroth16.so" | grep -q 'libvulkan'; then
            echo "libgroth16.so must dlopen Vulkan, not link it" >&2
            exit 1
          fi
          libpath="$("$prefix/bin/zkey" lib)"
          expected="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$prefix/lib/libgroth16.so")"
          test "$libpath" = "$expected"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          zarch="$(uname -m)"
          name="groth16-${version}-linux-${zarch}"
          prefix="${RUNNER_TEMP}/prefix"
          stage="${RUNNER_TEMP}/${name}"
          mkdir -p "$stage/bin" "$stage/lib" "$stage/include"
          cp "$prefix/bin/zkey" "$prefix/bin/prover" "$stage/bin/"
          cp "$prefix/lib/libgroth16.so" "$prefix/lib/libgroth16.a" "$stage/lib/"
          cp "$prefix/include/groth16.h" "$stage/include/"
          libpath="$("$stage/bin/zkey" lib)"
          expected="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$stage/lib/libgroth16.so")"
          test "$libpath" = "$expected"
          tar -C "$RUNNER_TEMP" -czf "${RUNNER_TEMP}/${name}.tar.gz" "$name"
          shasum -a 256 "${RUNNER_TEMP}/${name}.tar.gz"
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$version" \
              --notes "Linux ${zarch} archive. Vulkan multiscalar multiplication is used when libvulkan.so.1 and a compute device are present. Otherwise the CPU prover runs. The macOS archive for this tag is Metal." || true
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${RUNNER_TEMP}/${name}.tar.gz"
